# Neo4j + the CLI. `docker compose run --rm app mhc search "whale optimization" --json`
# Docker refuses to start without a password: NEO4J_PASSWORD must be in .env.
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env first}
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env first}
      MHC_ROOT: /work
      MODEL: ${MODEL:-openai:gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # one mount, not five: the repo *is* the data dir, so the xlsx lands back in
      # the working tree where the user can see it.
      # :z relabels for SELinux — without it a bind-mounted home dir is unreadable
      # inside the container even as root. Ignored on hosts without SELinux.
      - ./:/work:z
    working_dir: /app

volumes:
  neo4j-data:
