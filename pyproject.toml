[project]
name = "synapse"
version = "1.0.0"
description = "A subject-agnostic collection of scholarly works, in SQLite"
readme = "README.md"
authors = [
    { name = "Diego-Sealtiel Valderrama", email = "sealtielfreak@yandex.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "markitdown[pdf]>=0.1.8",
    "matplotlib>=3.10",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.51.0",
    "pydantic-settings>=2.15.0",
    "selenium>=4.20",
    "sqlmodel>=0.0.47",
    "typer>=0.27.2",
]

[project.scripts]
synapse = "synapse.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings-python>=1.18.0",
    "ruff>=0.16.9",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# db.py is the one module without `from __future__ import annotations`, because
# SQLModel resolves a relationship target from the *evaluated* annotation. So its
# forward references (`list["Paper"]`, declared before `Paper` exists) are real
# syntax rather than lazy strings, and UP037 would "fix" them into a NameError.
"src/synapse/persistence/models.py" = ["UP037"]

[tool.mypy]
# numpy (via matplotlib) ships stubs that use `type` statements — 3.12+ syntax
# mypy can only parse when it targets 3.12 or newer. The floor is 3.14 regardless.
python_version = "3.14"
plugins = ["pydantic.mypy"]  # otherwise Settings() looks like a missing-arg call
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_return_any = true
warn_unreachable = true

